name: Release

# Runs when a version tag is pushed, for example `git tag 0.1.0 && git push origin 0.1.0`.
# Obsidian reads the release whose tag equals the `version` in manifest.json (no "v" prefix).
# The release is created as a draft: check it on GitHub, then press "Publish release".

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Check that the tag matches manifest.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Build
        run: python3 -I build.py

      - name: Unit tests
        run: node --test test/unit/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing after the build"
              exit 1
            fi
          done
          # Release notes: the CHANGELOG section for this version.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file notes.md \
            main.js manifest.json styles.css
