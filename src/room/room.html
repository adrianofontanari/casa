<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa</title>
</head>
<body>
<!-- The room. build.py puts the CSP and the bridge shim first in <head>, room.css
     before </head>, and the scripts listed in order.txt before </body>.
     engine/room.js fills #casa-room; panels add their own nodes to <body>. -->
<main id="casa-room" class="casa-room" aria-label="Casa room">
  <div class="casa-stage">
    <canvas class="casa-canvas" aria-hidden="true"></canvas>
    <canvas class="casa-sprite casa-fall" aria-hidden="true"></canvas>
    <canvas class="casa-sprite casa-buddy" aria-hidden="true"></canvas>
    <canvas class="casa-sprite casa-pet" aria-hidden="true"></canvas>
    <div class="casa-goal" aria-hidden="true"><span></span></div>
    <div class="casa-slip" aria-hidden="true"></div>
    <nav class="casa-hots" aria-label="Objects in the room"></nav>
    <div class="casa-label" role="tooltip" hidden></div>
    <div class="casa-say" role="status" hidden></div>
  </div>
</main>
</body>
</html>
